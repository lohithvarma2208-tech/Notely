# Render Blueprint — Notely (Next.js + SQLite on a persistent disk)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: notely
    runtime: node
    plan: starter # persistent disks require a paid instance type
    buildCommand: npm install && npx prisma generate && npm run build
    # db push is idempotent (creates tables if missing) — the seed script is
    # intentionally NOT run in production: it truncates all tables.
    startCommand: npx prisma db push --skip-generate && npx next start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/notely.db
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@notely.local
      - key: ADMIN_PASSCODE
        sync: false # set in the Render dashboard (or keep your .env value)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # https://<your-service>.onrender.com/api/auth/google/callback
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
    disk:
      name: notely-data
      mountPath: /var/data
      sizeGB: 1
